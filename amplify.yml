version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 18 || nvm use 20 || nvm install 18
        - npm --prefix frontend install
    build:
      commands:
        - npm --prefix frontend run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
